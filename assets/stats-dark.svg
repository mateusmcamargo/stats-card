<svg xmlns="http://www.w3.org/2000/svg" width="480" height="394" viewBox="0 0 480 394" role="img" aria-label="GitHub stats">
    <style>
        text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; fill: #f8f8f2; }
        .accent { fill: #ff79c6; }
        .dim { fill-opacity: 0.6; }
        .end { text-anchor: end; }
        .rule { stroke: #f8f8f2; stroke-opacity: 0.35; stroke-width: 1; }
        .track { fill: #f8f8f2; fill-opacity: 0.15; }
        .bar { fill: #ff79c6; }
    </style>
    <rect x="0.5" y="0.5" width="479" height="393" rx="6" fill="#101017" stroke="#f8f8f2" stroke-opacity="0.35"/>
    <text x="24" y="34">~ <tspan class="accent">$</tspan> stats</text>
    <line class="rule" x1="0" y1="50" x2="480" y2="50"/>
    <text class="dim" x="24" y="74">commits (last year)</text>
    <text class="end" x="456" y="74">463</text>
    <text class="dim" x="24" y="96">pull requests</text>
    <text class="end" x="456" y="96">13</text>
    <text class="dim" x="24" y="118">issues</text>
    <text class="end" x="456" y="118">42</text>
    <text class="dim" x="24" y="140">stars</text>
    <text class="end" x="456" y="140">5</text>
    <text class="dim" x="24" y="162">repositories</text>
    <text class="end" x="456" y="162">21</text>
    <line class="rule" x1="0" y1="178" x2="480" y2="178"/>
    <text x="24" y="202">TypeScript</text>
    <rect class="track" x="120" y="193" width="270" height="8" rx="2"/>
    <rect class="bar" x="120" y="193" width="135.3" height="8" rx="2"/>
    <text class="end" x="456" y="202">50.1%</text>
    <text x="24" y="224">SCSS</text>
    <rect class="track" x="120" y="215" width="270" height="8" rx="2"/>
    <rect class="bar" x="120" y="215" width="46.5" height="8" rx="2"/>
    <text class="end" x="456" y="224">17.2%</text>
    <text x="24" y="246">JavaScript</text>
    <rect class="track" x="120" y="237" width="270" height="8" rx="2"/>
    <rect class="bar" x="120" y="237" width="26.0" height="8" rx="2"/>
    <text class="end" x="456" y="246">9.6%</text>
    <text x="24" y="268">Java</text>
    <rect class="track" x="120" y="259" width="270" height="8" rx="2"/>
    <rect class="bar" x="120" y="259" width="23.4" height="8" rx="2"/>
    <text class="end" x="456" y="268">8.7%</text>
    <text x="24" y="290">CSS</text>
    <rect class="track" x="120" y="281" width="270" height="8" rx="2"/>
    <rect class="bar" x="120" y="281" width="18.1" height="8" rx="2"/>
    <text class="end" x="456" y="290">6.7%</text>
    <line class="rule" x1="0" y1="306" x2="480" y2="306"/>
    <text class="dim" x="24" y="330">contributions</text>
    <text class="end" x="456" y="330">495</text>
    <text class="dim" x="24" y="352">current streak</text>
    <text class="end" x="456" y="352">6 days</text>
    <text class="dim" x="24" y="374">longest streak</text>
    <text class="end" x="456" y="374">6 days</text>
</svg>