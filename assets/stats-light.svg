<svg xmlns="http://www.w3.org/2000/svg" width="480" height="446" viewBox="0 0 480 446" role="img" aria-label="GitHub stats">
    <style>
        text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; fill: #101017; }
        .accent { fill: #ff79c6; font-weight: bold; }
        .strong { font-weight: bold; }
        .end { text-anchor: end; }
        .mid { text-anchor: middle; }
        .rule { stroke: #101017; stroke-width: 1; shape-rendering: crispEdges; }
        .btn { fill: none; stroke: #101017; stroke-width: 1; shape-rendering: crispEdges; }
        .track { fill: none; stroke: #101017; stroke-width: 1; shape-rendering: crispEdges; }
        .bar { fill: #ff79c6; shape-rendering: crispEdges; }
        .cursor { fill: #ff79c6; shape-rendering: crispEdges; }
    </style>
    <rect x="0.5" y="0.5" width="479" height="445" fill="#f8f8f2" stroke="#101017" stroke-width="1.5"/>
    <rect class="cursor" x="16" y="10" width="9" height="9"/>
    <rect class="btn" x="32" y="10" width="9" height="9"/>
    <rect class="btn" x="48" y="10" width="9" height="9"/>
    <text class="strong mid" x="240" y="19">mateusmcamargo@github: ~</text>
    <line class="rule" x1="0" y1="30" x2="480" y2="30"/>
    <text x="24" y="56"><tspan class="accent">$</tspan> stats --user mateusmcamargo</text>
    <text class="strong" x="24" y="82"># totals</text>
    <text x="24" y="102">commits (last year)</text>
    <text class="strong end" x="456" y="102">492</text>
    <text x="24" y="122">pull requests</text>
    <text class="strong end" x="456" y="122">13</text>
    <text x="24" y="142">issues</text>
    <text class="strong end" x="456" y="142">32</text>
    <text x="24" y="162">stars</text>
    <text class="strong end" x="456" y="162">5</text>
    <text x="24" y="182">repositories</text>
    <text class="strong end" x="456" y="182">22</text>
    <text class="strong" x="24" y="210"># languages</text>
    <text x="24" y="230">TypeScript</text>
    <rect class="track" x="130.5" y="220.5" width="250" height="10"/>
    <rect class="bar" x="131" y="220" width="124" height="11"/>
    <text class="strong end" x="456" y="230">50.0%</text>
    <text x="24" y="250">SCSS</text>
    <rect class="track" x="130.5" y="240.5" width="250" height="10"/>
    <rect class="bar" x="131" y="240" width="43" height="11"/>
    <text class="strong end" x="456" y="250">17.2%</text>
    <text x="24" y="270">JavaScript</text>
    <rect class="track" x="130.5" y="260.5" width="250" height="10"/>
    <rect class="bar" x="131" y="260" width="24" height="11"/>
    <text class="strong end" x="456" y="270">9.6%</text>
    <text x="24" y="290">Java</text>
    <rect class="track" x="130.5" y="280.5" width="250" height="10"/>
    <rect class="bar" x="131" y="280" width="22" height="11"/>
    <text class="strong end" x="456" y="290">8.6%</text>
    <text x="24" y="310">CSS</text>
    <rect class="track" x="130.5" y="300.5" width="250" height="10"/>
    <rect class="bar" x="131" y="300" width="17" height="11"/>
    <text class="strong end" x="456" y="310">6.7%</text>
    <text class="strong" x="24" y="338"># streak</text>
    <text x="24" y="358">contributions</text>
    <text class="strong end" x="456" y="358">525</text>
    <text x="24" y="378">current streak</text>
