    <text x="24" y="398">longest streak</text>
    <text class="strong end" x="456" y="398">10 days</text>
    <text x="24" y="426"><tspan class="accent">$</tspan></text>
    <rect class="cursor" x="40" y="414" width="8" height="15"/>
</svg>