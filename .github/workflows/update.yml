name: update

on:
    schedule:
        # Daily at 03:00 UTC
        - cron: "0 3 * * *"
    workflow_dispatch:

permissions:
    contents: write

jobs:
    generate:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - name: Generate SVGs
              env:
                  # STATS_TOKEN (classic PAT, read:user) counts private contributions;
                  # without it the default token only sees public data
                  STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: python generate.py
            - name: Commit if changed
              run: |
                  if git diff --quiet -- assets; then
                      echo "No changes"
                      exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add assets
                  git commit -m "chore: update stats"
                  git push